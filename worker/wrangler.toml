name = "lgtm-rooms"
main = "src/index.ts"
compatibility_date = "2026-04-07"
workers_dev = false

[dev]
port = 8787

[vars]
ALLOWED_ORIGINS = "http://localhost:4321,http://127.0.0.1:4321"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[exports.Room]
type = "durable-object"
storage = "sqlite"

[exports.Leaderboard]
type = "durable-object"
storage = "sqlite"

[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60
