name = "two-pizzas-rooms"
main = "src/index.ts"
compatibility_date = "2026-04-07"
workers_dev = false

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[dev]
port = 8787

[vars]
ALLOWED_ORIGINS = ""
DO_JURISDICTION = "eu"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[exports.Room]
type = "durable-object"
storage = "sqlite"

[exports.Leaderboard]
type = "durable-object"
storage = "sqlite"

[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "SOCKET_LIMIT"
namespace_id = "1002"

[ratelimits.simple]
limit = 120
period = 60
